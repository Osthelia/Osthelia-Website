<body class="bg-[#0a0612] text-white antialiased">

  <div class="scroll-progress" aria-hidden="true"></div>

  <div class="world-bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div id="stars" class="pointer-events-none absolute inset-0"></div>
    <div class="grain"></div>
  </div>

  <header class="site-header">
    <div class="mx-auto flex max-w-[1300px] items-center justify-between px-6 py-5 md:px-10">
      <a href="/" class="brand-mark flex items-center gap-2 text-[11px] uppercase no-underline">
        <strong>✦ Osthelia</strong>
      </a>

      <nav class="hidden items-center gap-9 md:flex" aria-label="Primary">
        <a href="/" class="nav-link">Home</a>

  <main id="top">

    <!-- HERO -->
    <section class="hero-section section relative overflow-hidden text-center">
      <div class="hero-orbit" aria-hidden="true">
        <div class="hero-star"></div>
      </div>

      <div class="section-inner relative">
        <h1 class="hero-title font-serif text-white">Our team</h1>

        <div class="mt-8 font-serif text-2xl text-[#d6b8ff] md:text-4xl">
          The people behind Osthelia.
        </div>

        <div class="scroll-cue" aria-hidden="true">
          <span class="scroll-cue-line"></span>
          Scroll
        </div>
      </div>
    </section>

    <!-- TEAM -->
    <section class="section pt-0">
      <div class="section-inner">
        <div id="team-root">
          <div class="data-state">
            <div class="spinner" aria-hidden="true"></div>
            Loading the team…
          </div>
        </div>
      </div>
    </section>

  </main>
